<!doctype html><html lang="id"><head>
<script src="./cbt-config.js"></script>
<script>
(function(){
  const C=window.CBT_CONFIG||{};
  window.CBT_API_URL=C.API_URL||'';
  window.cbtApiCall=async function(name,args){
    if(!window.CBT_API_URL || /PASTE_GAS_WEB_APP_URL_HERE/i.test(window.CBT_API_URL))
      throw new Error('API_URL belum diisi pada cbt-config.js.');
    const token=localStorage.getItem('cbtAdminToken')||localStorage.getItem('cbtRoleToken')||localStorage.getItem('cbtUserToken')||'';
    const res=await fetch(window.CBT_API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:name,args:Array.isArray(args)?args:[],token:token}),
      redirect:'follow',
      cache:'no-store'
    });
    const text=await res.text();
    let out;
    try{out=JSON.parse(text)}catch(e){throw new Error('Respons API tidak valid: '+text.slice(0,300))}
    if(!out.success) throw new Error(out.error||'Terjadi kesalahan server.');
    return out.data;
  };
})();
</script><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Pengawas</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}.app{display:flex;min-height:100vh}.side{width:250px;background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.side button{margin:4px 0;text-align:left;background:#1e293b;color:#fff;border:0;border-radius:8px;padding:10px;width:100%;cursor:pointer;font-weight:bold}.side button.danger{background:#dc2626}.main{flex:1;padding:22px;overflow:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stat,.panel{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 12px #0001}.stat b{font-size:30px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar button,button{padding:9px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-weight:bold}.secondary{background:#64748b!important}.success{background:#16a34a!important}.danger{background:#dc2626!important}.tablewrap{overflow:auto;background:#fff;border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}.table th{background:#eff6ff}.small{padding:6px 9px;font-size:12px}.notice{padding:11px;border-radius:8px;background:#e0f2fe;margin:10px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.full{grid-column:1/-1}select,input,textarea{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px;width:100%}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:bold;background:#e2e8f0}.badge.green{background:#dcfce7;color:#166534}.badge.yellow{background:#fef3c7;color:#92400e}.badge.red{background:#fee2e2;color:#991b1b}.sigbox{border:2px dashed #94a3b8;border-radius:10px;background:#fff;max-width:600px}.sigbox canvas{width:100%;height:220px;display:block;touch-action:none}.printarea{background:#fff;padding:25px;border-radius:12px}.center{text-align:center}@media(max-width:760px){.app{display:block}.side{width:100%;height:auto;position:static}.side button{width:auto;display:inline-block}.main{padding:12px}}
</style></head><body><div class="app"><aside class="side"><h2>PENGAWAS</h2><div id="who"></div><hr><button onclick="home()">🏠 Dashboard</button><button onclick="monitorPage()">👁 Monitoring Peserta</button><button onclick="absensiPage()">🧑‍🎓 Absensi Siswa</button><button onclick="baPage()">📄 Berita Acara</button><button onclick="riwayatBA()">📚 Riwayat Berita Acara</button><button class="danger" onclick="logout()">Keluar</button></aside><main class="main"><div class="top"><div><h1>Portal Pengawas</h1><div id="sub"></div></div><div id="clock"></div></div><div id="content"></div></main></div><div id="loading" style="display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;color:#fff"><div class="panel" id="loadText">Memproses...</div></div>
<script>let token=new URLSearchParams(location.search).get('token')||localStorage.getItem('cbtRoleToken')||'';
let me=null,data=null,bankRows=[],filterData=null,currentRows=[];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function load(t){$('loadText').textContent=t||'Memproses...';$('loading').style.display='flex'}
function unload(){$('loading').style.display='none'}
function call(name,...args){return cbtApiCall(name,args)}
function fail(e){const m=e&&e.message?e.message:String(e||'Terjadi kesalahan'); if(/Sesi telah berakhir|Sesi tidak valid|Akses ditolak/.test(m)){localStorage.removeItem('cbtRoleToken');localStorage.removeItem('cbtRoleUser');location.href='?page=index';return} alert(m)}
function clock(){$('clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'medium'})} setInterval(clock,1000); clock();
async function init(){
  try{
    if(!token) throw new Error('Token login tidak ditemukan. Silakan login kembali.');
    const r=await call('getRoleMe',token);
    if(!r || !r.success || String(r.role).toUpperCase()!=='PENGAWAS') throw new Error('Sesi portal PENGAWAS tidak valid. Silakan login kembali.');
    me=r.user; localStorage.setItem('cbtRoleToken',token); localStorage.setItem('cbtRoleUser',JSON.stringify(me));
    $('who').textContent=me.nama+' • PENGAWAS';
    $('sub').textContent='Monitoring, absensi siswa dan berita acara ujian';
    await home();
  }catch(e){
    $('content').innerHTML='<div class="panel"><h2>Portal PENGAWAS</h2><p>'+esc(e&&e.message?e.message:e)+'</p><button onclick="location.href=\"?page=index\"">Kembali ke Login</button></div>';
  }
}
async function home(){load('Memuat dashboard...');try{if(!filterData)filterData=await call('pengawasGetFilters',token);data=await call('pengawasDashboard',token);$('content').innerHTML='<div class="notice">Gunakan menu <b>Absensi Siswa</b> untuk mencatat kehadiran dan <b>Berita Acara</b> untuk membuat dokumen pelaksanaan ujian.</div><div class="grid">'+data.ujian.map(x=>`<div class="panel"><h3>${esc(x.nama)}</h3><p><b>${esc(x.mapel)}</b><br>Kelas: ${esc(x.kelas)}<br>Sesi: ${esc(x.sesi||'-')}<br>Ruang: ${esc(x.ruang||'-')}<br>Durasi: ${x.durasi} menit</p><button onclick="monitor('${esc(x.id)}')">👁 Monitor</button></div>`).join('')+'</div>'}catch(e){fail(e)}finally{unload()}}
function examSelect(id='exam'){return `<label>Ujian<select id="${id}">${(filterData?.ujian||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.nama)} — ${esc(x.mapel)} — ${esc(x.kelas)}</option>`).join('')}</select></label>`}function sessionSelect(id='sesi'){return `<label>Sesi<select id="${id}"><option value="">Semua Sesi</option>${(filterData?.sesi||[]).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`}function roomSelect(id='ruang'){return `<label>Ruang<select id="${id}"><option value="">Semua Ruang</option>${(filterData?.ruang||[]).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`}
async function monitorPage(){load('Memuat monitoring...');try{if(!filterData)filterData=await call('pengawasGetFilters',token);$('content').innerHTML='<h2>👁 Monitoring Peserta</h2><div class="form">'+examSelect('monExam')+sessionSelect('monSesi')+roomSelect('monRuang')+'</div><div class="toolbar"><button onclick="monitor($('+'\'monExam\''+').value)">Monitor Ujian</button></div><div class="notice">Sesi dan ruang dapat digunakan sebagai filter tampilan. Penugasan pengawas tetap diperiksa di server.</div>'}catch(e){fail(e)}finally{unload()}}
async function monitor(id){load('Memuat peserta...');try{currentRows=await call('pengawasGetPeserta',token,id);renderMonitor(id)}catch(e){fail(e)}finally{unload()}}
function statusBadge(s){let c=s==='SELESAI'?'green':s==='SEDANG MENGERJAKAN'?'yellow':'red';return `<span class="badge ${c}">${esc(s)}</span>`}function renderMonitor(id){const rows=currentRows||[];$('content').innerHTML='<div class="toolbar"><button class="secondary" onclick="monitorPage()">← Kembali</button><button onclick="monitor(\''+esc(id)+'\')">↻ Refresh</button></div><div class="grid"><div class="stat">Total Peserta<br><b>'+rows.length+'</b></div><div class="stat">Sedang Mengerjakan<br><b>'+rows.filter(x=>x.status==='SEDANG MENGERJAKAN').length+'</b></div><div class="stat">Selesai<br><b>'+rows.filter(x=>x.status==='SELESAI').length+'</b></div><div class="stat">Belum Mulai<br><b>'+rows.filter(x=>x.status==='BELUM MULAI').length+'</b></div></div><div class="tablewrap" style="margin-top:14px"><table class="table"><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Mulai</th><th>Aktivitas Terakhir</th><th>Terjawab</th><th>Sisa</th></tr>'+rows.map(r=>`<tr><td>${esc(r.nis)}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${statusBadge(r.status)}</td><td>${fmt(r.mulai)}</td><td>${fmt(r.terakhir)}</td><td>${esc(r.terjawab)}</td><td>${r.sisaDetik==null?'-':remain(r.sisaDetik)}</td></tr>`).join('')+'</table></div>'}function fmt(v){if(!v)return '-';const d=new Date(v);return isNaN(d)?'-':d.toLocaleTimeString('id-ID')}function remain(s){s=Math.max(0,Number(s)||0);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function absensiPage(){load('Memuat absensi...');try{if(!filterData)filterData=await call('pengawasGetFilters',token);$('content').innerHTML='<h2>🧑‍🎓 Absensi Siswa</h2><div class="form">'+examSelect('abExam')+sessionSelect('abSesi')+roomSelect('abRuang')+'</div><div class="toolbar"><button onclick="loadAbsensi()">Tampilkan Peserta</button><button class="success" onclick="saveAbsensi()">💾 Simpan Absensi</button></div><div class="notice">Pilih <b>Sesi</b> dan <b>Ruang</b> sesuai pelaksanaan. Status dapat diubah menjadi HADIR, IZIN, SAKIT, atau ALPA.</div><div id="absTable"></div>';await loadAbsensi()}catch(e){fail(e)}finally{unload()}}
async function loadAbsensi(){load('Memuat daftar siswa...');try{const rows=await call('pengawasGetAbsensi',token,$('abExam').value,$('abSesi').value,$('abRuang').value);currentRows=Array.isArray(rows)?rows:[];$('absTable').innerHTML='<div class="tablewrap"><table class="table"><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th>Keterangan</th></tr>'+rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.NIS)}</td><td>${esc(r.Nama)}</td><td>${esc(r.Kelas)}</td><td><select id="abs_${esc(r.ID_Siswa)}"><option ${r.Status==='HADIR'?'selected':''}>HADIR</option><option ${r.Status==='IZIN'?'selected':''}>IZIN</option><option ${r.Status==='SAKIT'?'selected':''}>SAKIT</option><option ${r.Status==='ALPA'?'selected':''}>ALPA</option></select></td><td><input id="ket_${esc(r.ID_Siswa)}" value="${esc(r.Keterangan)}"></td></tr>`).join('')+'</table></div>'}catch(e){fail(e)}finally{unload()}}
async function saveAbsensi(){load('Menyimpan absensi...');try{const rows=(Array.isArray(currentRows)?currentRows:[]).map(r=>({ID_Ujian:$('abExam').value,ID_Siswa:r.ID_Siswa,Sesi:$('abSesi').value||r.Sesi,Ruang:$('abRuang').value||r.Ruang,Status:$('abs_'+r.ID_Siswa).value,Keterangan:$('ket_'+r.ID_Siswa).value}));await call('pengawasSaveAbsensi',token,rows);alert('Absensi berhasil disimpan.')}catch(e){fail(e)}finally{unload()}}
async function baPage(){load('Menyiapkan berita acara...');try{if(!filterData)filterData=await call('pengawasGetFilters',token);$('content').innerHTML='<h2>📄 Buat Berita Acara</h2><div class="panel"><div class="form">'+examSelect('baExam')+sessionSelect('baSesi')+roomSelect('baRuang')+'<label>Tanggal<input id="baTanggal" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Jam Mulai<input id="baMulai" type="time"></label><label>Jam Selesai<input id="baSelesai" type="time"></label><label>Jumlah Peserta<input id="baJumlah" type="number" value="0"></label><label>Hadir<input id="baHadir" type="number" value="0"></label><label>Tidak Hadir<input id="baTidak" type="number" value="0"></label><label class="full">Catatan<textarea id="baCatatan" rows="4" placeholder="Catatan pelaksanaan ujian..."></textarea></label></div><h3>Tanda Tangan Pengawas</h3><div class="sigbox"><canvas id="sig"></canvas></div><div class="toolbar"><button class="secondary" onclick="clearSig()">Hapus Tanda Tangan</button><button class="success" onclick="saveBA()">💾 Simpan Berita Acara</button></div></div>';setupSig();await syncBAFromAttendance()}catch(e){fail(e)}finally{unload()}}
async function syncBAFromAttendance(){try{const r=await call('pengawasGetAbsensi',token,$('baExam').value,$('baSesi').value,$('baRuang').value);$('baJumlah').value=r.length;$('baHadir').value=r.filter(x=>x.Status==='HADIR').length;$('baTidak').value=r.filter(x=>x.Status!=='HADIR').length}catch(e){}}
function setupSig(){const c=$('sig'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=220;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2;x.lineCap='round';let drawing=false,last=null;function pos(ev){const r=c.getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;return {x:p.clientX-r.left,y:p.clientY-r.top}}function down(ev){drawing=true;last=pos(ev);ev.preventDefault()}function move(ev){if(!drawing)return;const p=pos(ev);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;ev.preventDefault()}function up(){drawing=false;last=null}c.onmousedown=down;c.onmousemove=move;c.onmouseup=up;c.onmouseleave=up;c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=up}function clearSig(){const c=$('sig'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height)}async function saveBA(){load('Menyimpan berita acara...');try{const c=$('sig'),d={ID_Ujian:$('baExam').value,Sesi:$('baSesi').value,Ruang:$('baRuang').value,Tanggal:$('baTanggal').value,Jam_Mulai:$('baMulai').value,Jam_Selesai:$('baSelesai').value,Jumlah_Peserta:$('baJumlah').value,Hadir:$('baHadir').value,Tidak_Hadir:$('baTidak').value,Catatan:$('baCatatan').value,Tanda_Tangan:c.toDataURL('image/png')};const r=await call('pengawasSaveBeritaAcara',token,d);alert(r.message);riwayatBA()}catch(e){fail(e)}finally{unload()}}
async function riwayatBA(){load('Memuat berita acara...');try{const rows=await call('pengawasGetBeritaAcara',token,{});$('content').innerHTML='<h2>📚 Riwayat Berita Acara</h2><div class="tablewrap"><table class="table"><tr><th>Tanggal</th><th>Ujian</th><th>Sesi</th><th>Ruang</th><th>Peserta</th><th>Hadir</th><th>Tidak Hadir</th><th>Pengawas</th><th>Aksi</th></tr>'+rows.map((r,i)=>`<tr><td>${esc(r.Tanggal)}</td><td>${esc(r.ID_Ujian)}</td><td>${esc(r.Sesi)}</td><td>${esc(r.Ruang)}</td><td>${esc(r.Jumlah_Peserta)}</td><td>${esc(r.Hadir)}</td><td>${esc(r.Tidak_Hadir)}</td><td>${esc(r.Dibuat_Oleh)}</td><td><button class="small" onclick="printBA(${i})">🖨 Cetak</button></td></tr>`).join('')+'</table></div>';window.baRows=rows}catch(e){fail(e)}finally{unload()}}
function printBA(i){const r=(window.baRows||[])[i];if(!r)return;const w=window.open('','_blank');w.document.write(`<html><head><title>Berita Acara</title><style>body{font-family:Arial;padding:35px}h2{text-align:center}table{width:100%;border-collapse:collapse}td{padding:8px;border:1px solid #333}.sig{max-width:300px;max-height:150px}</style></head><body><h2>BERITA ACARA PELAKSANAAN UJIAN</h2><table><tr><td>Ujian</td><td>${esc(r.ID_Ujian)}</td></tr><tr><td>Sesi</td><td>${esc(r.Sesi)}</td></tr><tr><td>Ruang</td><td>${esc(r.Ruang)}</td></tr><tr><td>Tanggal</td><td>${esc(r.Tanggal)}</td></tr><tr><td>Jam</td><td>${esc(r.Jam_Mulai)} - ${esc(r.Jam_Selesai)}</td></tr><tr><td>Jumlah Peserta</td><td>${esc(r.Jumlah_Peserta)}</td></tr><tr><td>Hadir</td><td>${esc(r.Hadir)}</td></tr><tr><td>Tidak Hadir</td><td>${esc(r.Tidak_Hadir)}</td></tr><tr><td>Catatan</td><td>${esc(r.Catatan)}</td></tr></table><br><div style="text-align:right">Pengawas,<br><br>${r.Tanda_Tangan?`<img class="sig" src="${esc(r.Tanda_Tangan)}"><br>`:''}<b>${esc(r.Dibuat_Oleh)}</b></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
async function logout(){const oldToken=token;localStorage.removeItem('cbtRoleToken');localStorage.removeItem('cbtRoleUser');token='';try{if(oldToken)await call('logoutRole',oldToken)}catch(e){}window.location.href=(window.CBT_CONFIG.INDEX_URL||'./index.html')}init();</script></body></html>
